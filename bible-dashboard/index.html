<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Exodus | Bible Study Library</title>
  <link rel="stylesheet" href="biblestudy.css">
</head>
<body>
  <div class="bible-study-container">
    
    <header class="bible-study-header">
      <h1>📖 Bible Study Library</h1>
      <p>Browse administrator-created Bible studies and continue your walk with Christ.</p>
    </header>

    <section class="scripture-card">
      <h2>Today's Scripture</h2>
      <p class="scripture-text">"Your word is a lamp to my feet and a light to my path."</p>
      <p class="scripture-reference">— Psalm 119:105</p>
    </section>

    <section class="study-search">
      <input id="searchBox" type="text" placeholder="Search by title or scripture...">
    </section>

    <main id="bibleStudyList">
      <div class="empty-study">
        <p>Loading Bible studies...</p>
      </div>
    </main>

  </div>

  <script src="biblestudy.js"></script>
</body>
</html>
